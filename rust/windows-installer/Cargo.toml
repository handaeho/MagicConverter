[package]
name = "magic-converter-windows-setup"
version = "3.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.23"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "9.5", default-features = false, features = ["deflate", "xz"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem", "Win32_System_Registry",
] }
