<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">MagicConverter</title>
  <desc id="desc">Offline file conversion for Windows. A cyan document and gold wand on an indigo background.</desc>
