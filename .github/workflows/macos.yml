name: macOS build and verification
on:
  push:
    branches: ['codex/macos-3.0.5', 'codex/macos-parity']
    paths:
      - 'rust/**'
      - 'packaging/macos/build.sh'
      - 'packaging/macos/runtime.sh'
      - 'tools/build/bundle_macos_runtime.py'
      - 'tools/validation/verify_macos_conversions.py'
      - 'tests/fixtures/macos/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    name: macOS-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            rust/magic-converter/target
          key: macos-${{ matrix.arch }}-${{ hashFiles('rust/magic-converter/Cargo.lock') }}-${{ github.sha }}
          restore-keys: macos-${{ matrix.arch }}-${{ hashFiles('rust/magic-converter/Cargo.lock') }}-
      - name: Build macOS package
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          rustup toolchain install 1.92.0 --profile minimal
          export RUSTUP_TOOLCHAIN=1.92.0
          export MAGIC_CONVERTER_FULL_RUNTIME=1
          bash packaging/macos/build.sh "$RUNNER_TEMP/release"
      - name: Verify the extracted app
        shell: bash
        run: |
          export MAGIC_CONVERTER_PROFILE_DIR="$RUNNER_TEMP/magicconverter-profile"
          mkdir "$RUNNER_TEMP/extracted"
          ditto -x -k "$RUNNER_TEMP/release/MagicConverter-3.0.5-macOS-${{ matrix.arch }}.zip" "$RUNNER_TEMP/extracted"
          app="$RUNNER_TEMP/extracted/MagicConverter.app"
          bin="$app/Contents/MacOS"
          codesign --verify --deep --strict "$app"
          "$bin/MagicConverter" --smoke-test
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")" = 30502
          test -s "$app/Contents/Resources/AppIcon.icns"
          iconutil --convert iconset --output "$RUNNER_TEMP/check-icon.iconset" "$app/Contents/Resources/AppIcon.icns"
          "$bin/magic_converter-cli" --version | grep '3\.0\.5$'
          "$app/Contents/vendor/rhwp/rhwp" --version
          "$bin/magic_converter-cli" actions >/dev/null
          python3 -m venv "$RUNNER_TEMP/python"
          py="$RUNNER_TEMP/python/bin/python"
          "$py" -m pip install --disable-pip-version-check 'pymupdf==1.28.2' python-docx pillow pillow-heif
          "$py" tools/validation/verify_macos_office.py --office "$app/Contents/vendor/office/LibreOffice.app/Contents/MacOS/soffice" --worker "$bin/magic_converter-cli" --output "$RUNNER_TEMP/office-check"
          cp "$RUNNER_TEMP/office-check/report.json" "$RUNNER_TEMP/release/office-${{ matrix.arch }}.json"
          "$py" tools/validation/verify_rust_pdf_pptx_layout.py --candidate "$bin/magic_converter-cli" --output "$RUNNER_TEMP/pdf-test"
          "$py" tools/validation/verify_rust_word_photo_table.py --candidate "$bin/magic_converter-cli" --rhwp "$app/Contents/vendor/rhwp/rhwp" --output "$RUNNER_TEMP/word-test"
          "$bin/magic_converter-cli" available -- "$RUNNER_TEMP/pdf-test/layout.pdf" | grep '"pptx_editable"'
          xcrun swiftc tools/validation/verify_macos_launch.swift -o "$RUNNER_TEMP/check-window"
          /usr/bin/open -n -a "$app"
          "$RUNNER_TEMP/check-window" "$app" --keep-running
          xcrun swiftc tools/validation/verify_macos_drag.swift -o "$RUNNER_TEMP/check-drag"
          mkdir "$RUNNER_TEMP/drag-test"
          "$py" -c 'from PIL import Image; import sys; Image.new("RGB", (40, 30), (52, 91, 140)).save(sys.argv[1])' "$RUNNER_TEMP/drag-test/drag.png"
          "$RUNNER_TEMP/check-drag" "$RUNNER_TEMP/drag-test/drag.png" shift "$RUNNER_TEMP/drag-test/drag_converted.jpg" "$bin/magic_converter-cli"
          "$RUNNER_TEMP/check-drag" "$RUNNER_TEMP/drag-test/drag.png" control "$RUNNER_TEMP/drag-test/drag_converted.png" "$bin/magic_converter-cli"
          mkdir "$RUNNER_TEMP/finder-test"
          cp "$RUNNER_TEMP/drag-test/drag.png" "$RUNNER_TEMP/finder-test/drag.png"
          "$RUNNER_TEMP/check-drag" "$RUNNER_TEMP/finder-test/drag.png" shift "$RUNNER_TEMP/finder-test/drag_converted.jpg" "$bin/magic_converter-cli" --finder
          "$RUNNER_TEMP/check-drag" "$RUNNER_TEMP/finder-test/drag.png" control "$RUNNER_TEMP/finder-test/drag_converted.png" "$bin/magic_converter-cli" --finder
          "$RUNNER_TEMP/check-drag" "$RUNNER_TEMP/drag-test/drag.png" shift "$HOME/Downloads/MagicConverter" "$bin/magic_converter-cli" --web
          "$RUNNER_TEMP/check-drag" "$RUNNER_TEMP/drag-test/drag.png" shift "$HOME/Downloads/MagicConverter" "$bin/magic_converter-cli" --raw
          "$RUNNER_TEMP/check-drag" "$RUNNER_TEMP/drag-test/drag.png" shift "$HOME/Downloads/MagicConverter" "$bin/magic_converter-cli" --promise
          "$RUNNER_TEMP/check-drag" "$RUNNER_TEMP/drag-test/drag.png" shift "$HOME/Downloads/MagicConverter" "$bin/magic_converter-cli" --plain
          testapp="$RUNNER_TEMP/SettingsTest.app"
          mkdir -p "$testapp/Contents/MacOS" "$testapp/Contents/Resources"
          cp "$app/Contents/Info.plist" "$testapp/Contents/Info.plist"
          cp "$app/Contents/Resources/catalog.json" "$testapp/Contents/Resources/"
          cp tools/validation/verify_macos_settings.swift "$RUNNER_TEMP/main.swift"
          xcrun swiftc "$RUNNER_TEMP/main.swift" packaging/macos/Settings.swift packaging/macos/Wheel.swift -o "$testapp/Contents/MacOS/MagicConverter"
          MAGIC_CONVERTER_PROFILE_DIR="$RUNNER_TEMP/settings-profile" "$testapp/Contents/MacOS/MagicConverter" "$RUNNER_TEMP/settings-test" "$bin/magic_converter-cli" "$RUNNER_TEMP/drag-test/drag.png"
          "$py" tools/validation/verify_macos_automation.py --worker "$bin/magic_converter-cli" --image "$RUNNER_TEMP/drag-test/drag.png" --output "$RUNNER_TEMP/automation-test"
          "$app/Contents/vendor/ffmpeg/ffmpeg" -hide_banner -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30 -t 8 -c:v libx264 -preset ultrafast "$RUNNER_TEMP/cancel-test.mp4"
          "$py" tools/validation/verify_rust_mcp.py --worker "$bin/magic_converter-cli" --server "$bin/magic_converter-mcp" --media "$RUNNER_TEMP/cancel-test.mp4" --output "$RUNNER_TEMP/mcp-test"
          # Deny access to build-machine Homebrew so missing bundled engines
          # cannot accidentally pass the offline deployment comparison.
          printf '(version 1)(allow default)(deny file-read* (subpath "/opt/homebrew") (subpath "/usr/local/Cellar") (subpath "/usr/local/opt"))\n' > "$RUNNER_TEMP/no-homebrew.sb"
          printf '#!/bin/sh\nexec /usr/bin/sandbox-exec -f "%s" "%s" "$@"\n' "$RUNNER_TEMP/no-homebrew.sb" "$bin/magic_converter-cli" > "$RUNNER_TEMP/offline-cli"
          chmod 755 "$RUNNER_TEMP/offline-cli"
          "$py" tools/validation/verify_macos_conversions.py --worker "$RUNNER_TEMP/offline-cli" --output "$RUNNER_TEMP/conversions" --reference tests/fixtures/macos/windows-execution.json
          cp "$RUNNER_TEMP/conversions/verification.json" "$RUNNER_TEMP/release/conversions-${{ matrix.arch }}.json"
          # Exercise the actual Installer package and the app's native removal menu.
          osascript -e 'tell application id "com.handaeho.magicconverter" to quit'
          sleep 2
          installer -pkg "$RUNNER_TEMP/release/MagicConverter-3.0.5-macOS-${{ matrix.arch }}.pkg" -target CurrentUserHomeDirectory
          installed="$HOME/Applications/MagicConverter.app"
          codesign --verify --deep --strict "$installed"
          /usr/bin/open -n -a "$installed"
          "$RUNNER_TEMP/check-window" "$installed" --keep-running
          xcrun swiftc tools/validation/verify_macos_uninstall.swift -o "$RUNNER_TEMP/check-uninstall"
          printf 'retain user settings\n' > "$MAGIC_CONVERTER_PROFILE_DIR/retain-test.txt"
          "$RUNNER_TEMP/check-uninstall" "$installed"
          test -s "$MAGIC_CONVERTER_PROFILE_DIR/retain-test.txt"
          printf 'Architecture: %s\nApp launch, PDF-to-PPTX, DOCX-to-HWPX, drag wheels, IPC, watch, conversion comparison, package installation and native uninstall passed.\n' \
            "$(uname -m)" > "$RUNNER_TEMP/release/verification-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MagicConverter-macOS-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.pkg
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/verification-*.txt
            ${{ runner.temp }}/release/*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macOS-conversion-report-${{ matrix.arch }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/conversions/verification.json
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            rust/magic-converter/target
          key: macos-${{ matrix.arch }}-${{ hashFiles('rust/magic-converter/Cargo.lock') }}-${{ github.sha }}
