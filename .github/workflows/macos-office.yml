name: macOS bundled Office verification
on:
  push:
    branches: ['codex/macos-parity']
    paths: ['packaging/macos/office.sh', '.github/workflows/macos-office.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  office:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify the standalone bundled Office engine
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/office-work"
          bash packaging/macos/office.sh "$RUNNER_TEMP/OfficeCheck.app" "$RUNNER_TEMP/office-work"
          python3 -m venv "$RUNNER_TEMP/python"
          "$RUNNER_TEMP/python/bin/python" -m pip install --disable-pip-version-check pymupdf==1.28.2
          "$RUNNER_TEMP/python/bin/python" tools/validation/verify_macos_office.py --office "$RUNNER_TEMP/OfficeCheck.app/Contents/vendor/office/LibreOffice.app/Contents/MacOS/soffice" --output "$RUNNER_TEMP/office-check"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macOS-Office-${{ matrix.runner }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/office-check/report.json
